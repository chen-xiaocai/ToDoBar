name: Build and test

on:
  push:
    branches: [main, feature/lan-inbox]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore release key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/todobar-release.p12"
      - name: Test, lint, and build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}/todobar-release.p12', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle testDebugUnitTest lintDebug assembleDebug ${{ startsWith(github.ref, 'refs/tags/v') && 'assembleRelease' || '' }} --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Test
        run: xcodebuild -project ToDoBarSync.xcodeproj -scheme ToDoBarSync -destination 'platform=macOS' test CODE_SIGNING_ALLOWED=NO
      - name: Build universal app
        run: xcodebuild -project ToDoBarSync.xcodeproj -scheme ToDoBarSync -configuration Release -derivedDataPath DerivedData ARCHS='x86_64 arm64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: Ad-hoc sign and package
        run: |
          codesign --force --deep --sign - DerivedData/Build/Products/Release/ToDoBarSync.app
          ditto -c -k --sequesterRsrc --keepParent DerivedData/Build/Products/Release/ToDoBarSync.app ToDoBar-Sync-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ToDoBar-Sync-macOS-universal.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          cp artifacts/android-apk/app/release/app-release.apk ToDoBar-Inbox.apk
          cp artifacts/macos-app/ToDoBar-Sync-macOS-universal.zip .
          sha256sum ToDoBar-Inbox.apk ToDoBar-Sync-macOS-universal.zip > SHA256SUMS
          cp LICENSE.md LICENSE.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ToDoBar-Inbox.apk
            ToDoBar-Sync-macOS-universal.zip
            SHA256SUMS
            LICENSE.txt
