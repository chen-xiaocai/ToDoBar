name: ToDoBarSync
options:
  bundleIdPrefix: com.chenxiaocai
  deploymentTarget:
    macOS: "13.0"
packages:
  HotKey:
    url: https://github.com/soffes/HotKey
    revision: c13662730cb5bc28de4a799854bbb018a90649bf
  LaunchAtLogin:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    revision: 9c41991631605c8ccfe0347bbcb5c659169f2ec5
targets:
  ToDoBarSync:
    type: application
    platform: macOS
    sources:
      - path: ToDoBar
        excludes:
          - Base.lproj/Main.storyboard
          - Info.plist
          - ToDoBar.entitlements
    dependencies:
      - package: HotKey
      - package: LaunchAtLogin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenxiaocai.ToDoBarSync
        PRODUCT_NAME: ToDoBarSync
        MARKETING_VERSION: 0.1.4
        CURRENT_PROJECT_VERSION: 5
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ToDoBar/Info.plist
  ToDoBarSyncTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ToDoBarSyncTests]
    dependencies:
      - target: ToDoBarSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenxiaocai.ToDoBarSyncTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ToDoBarSync:
    build:
      targets:
        ToDoBarSync: all
        ToDoBarSyncTests: [test]
    test:
      targets: [ToDoBarSyncTests]
